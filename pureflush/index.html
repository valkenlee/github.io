<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마작 청일색 퀴즈 (실제 패 이미지 적용)</title>
    <style>
        body { font-family: sans-serif; background: #2e5a3c; color: white; padding: 20px; text-align: center; }
        .hand-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: nowrap; /* 한 줄로 유지 */
            overflow-x: auto;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        .tile-img {
            width: 44px; /* 패 크기 조절 */
            height: auto;
            filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body>

<h1>🀄 마작패 이미지 연동 예시</h1>

<div class="hand-container" id="hand"></div>

<script>
    // GitHub 오픈소스 리치마작패 SVG 링크 매핑 (만자: m1~m9, 통자: p1~p9, 삭자: s1~s9)
    const BASE_URL = "https://raw.githubusercontent.com/FluffyStuff/riichi-mahjong-tiles/main/assets/tiles/svg/";

    // 예시: 삭자 청일색 텐파이 패 (2223456777888삭)
    const sampleHand = [
        's2', 's2', 's2', 
        's3', 's4', 's5', 
        's6', 
        's7', 's7', 's7', 
        's8', 's8', 's8'
    ];

    const container = document.getElementById('hand');
    sampleHand.forEach(tileCode => {
        const img = document.createElement('img');
        img.src = `${BASE_URL}${tileCode}.svg`;
        img.className = 'tile-img';
        img.alt = tileCode;
        container.appendChild(img);
    });
</script>

</body>
</html>
