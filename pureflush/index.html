<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마작 청일색 텐파이 퀴즈 (난이도 선택)</title>
    <!-- ZIP 파일을 브라우저에서 읽기 위한 JSZip 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e3f20;
            color: #333;
        }
        h1 { 
            text-align: center; 
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        /* 난이도 버튼 그룹 스타일 */
        .difficulty-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-diff {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-diff:hover:not(:disabled) { transform: translateY(-2px); }
        .btn-diff:disabled { background-color: #95a5a6 !important; cursor: not-allowed; transform: none; }
        
        .btn-easy { background-color: #27ae60; }
        .btn-easy:hover:not(:disabled) { background-color: #219150; }
        
        .btn-normal { background-color: #e67e22; }
        .btn-normal:hover:not(:disabled) { background-color: #d35400; }
        
        .btn-hard { background-color: #c0392b; }
        .btn-hard:hover:not(:disabled) { background-color: #a93226; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-submit:hover { background-color: #2471a3; }

        .hand-container-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 15px 0;
            background: #2b542c;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .hand-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            min-height: 70px;
            padding: 0 10px;
        }

        /* 마작패 입체 스타일 적용 */
        .tile-img {
            width: 44px;
            height: 60px;
            background-color: #fdfbf7;
            border: 1px solid #d1ccc0;
            border-radius: 6px;
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.9),
                inset -1px -1px 2px rgba(0, 0, 0, 0.15),
                1px 2px 4px rgba(0, 0, 0, 0.3);
            padding: 3px 2px 2px 2px;
            box-sizing: border-box;
            object-fit: contain;
            flex-shrink: 0;
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tile-img:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.9),
                inset -1px -1px 2px rgba(0, 0, 0, 0.15),
                2px 5px 8px rgba(0, 0, 0, 0.4);
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        .btn-number {
            padding: 12px 0;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background-color: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-number.selected {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .hint-badge {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
        }

        .result-message {
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
        }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<h1>🀄 청일색 텐파이 대기패 퀴즈</h1>

<div class="card">
    <div id="status-msg" style="text-align:center; font-weight:bold; margin-bottom:12px; color:#e67e22;">
        📦 Regular.zip 패키지를 읽어오는 중입니다...
    </div>
    
    <div class="difficulty-group">
        <button class="btn-diff btn-easy" onclick="generateQuiz('easy')" disabled> 🌱 쉬움 </button>
        <button class="btn-diff btn-normal" onclick="generateQuiz('normal')" disabled> 🌿 보통 </button>
        <button class="btn-diff btn-hard" onclick="generateQuiz('hard')" disabled> 🔥 어려움 </button>
    </div>

    <div style="text-align: center; margin-top: 15px;">
        <span id="suit-name" style="font-weight: bold; font-size: 18px; color: #444;"></span>
        <div id="easy-hint" class="hint-badge" style="display: none;"></div>
    </div>
    
    <div class="hand-container-wrapper">
        <div class="hand-display" id="hand-container"></div>
    </div>
</div>

<div class="card" id="quiz-area" style="display: none;">
    <h3 style="margin-top:0;">오름패(대기패)가 되는 숫자를 모두 선택하세요:</h3>
    <div class="selection-grid" id="selection-buttons"></div>
    <button class="btn-submit" onclick="submitAnswer()">제출 및 정답 확인</button>
    <div id="result" class="result-message" style="display: none;"></div>
</div>

<script>
    let zipInstance = null;
    const tileSvgCache = {};

    const SUITS = [
        { code: 'Man', name: '만자패(萬)' },
        { code: 'Pin', name: '통자패(筒)' },
        { code: 'Sou', name: '삭자패(索)' }
    ];
    
    let currentSuitObj = null;
    let currentHand = [];
    let winningTiles = [];
    let selectedTiles = new Set();

    // 페이지 로드 시 동일 경로의 Regular.zip 파일 읽기
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('Regular.zip');
            if (!response.ok) throw new Error('Regular.zip 파일을 찾을 수 없습니다.');
            
            const arrayBuffer = await response.arrayBuffer();
            zipInstance = await JSZip.loadAsync(arrayBuffer);
            
            document.getElementById('status-msg').style.color = '#27ae60';
            document.getElementById('status-msg').innerText = '✅ 마작패 로딩 완료! 원하는 난이도를 선택하세요.';
            
            document.querySelectorAll('.btn-diff').forEach(btn => btn.disabled = false);
        } catch (err) {
            document.getElementById('status-msg').style.color = '#e74c3c';
            document.getElementById('status-msg').innerText = '❌ Regular.zip 로딩 실패! index.html과 같은 폴더에 Regular.zip이 있는지 확인해주세요.';
            console.error(err);
        }
    });

    async function getTileImageSrc(suitCode, num) {
        const targetName = `${suitCode}${num}.svg`;
        const cacheKey = `${suitCode}${num}`;
        
        if (tileSvgCache[cacheKey]) return tileSvgCache[cacheKey];

        let targetFile = null;
        zipInstance.forEach((relativePath, file) => {
            if (relativePath.endsWith(targetName)) {
                targetFile = file;
            }
        });

        if (targetFile) {
            const text = await targetFile.async('string');
            const blob = new Blob([text], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            tileSvgCache[cacheKey] = url;
            return url;
        }
        return '';
    }

    function generateQuiz(difficulty) {
        currentSuitObj = SUITS[Math.floor(Math.random() * SUITS.length)];
        let hand = [];
        let waits = [];

        // 난이도별 조건에 맞는 문제 루프 탐색
        while (true) {
            hand = generateRandom13Tiles();
            waits = getWinningTiles(hand);
            const count = waits.length;

            if (difficulty === 'easy') {
                // 오름패 1개 ~ 2개
                if (count >= 1 && count <= 2) break;
            } else if (difficulty === 'normal') {
                // 오름패 2개 ~ 4개
                if (count >= 2 && count <= 4) break;
            } else if (difficulty === 'hard') {
                // 오름패 2개 ~ 9개 (3개 이상을 최우선 생성)
                if (count >= 3 && count <= 9) break;
                // 3개 이상 조건이 너무 안 뜰 경우 무한 루프 방지를 위해 2개도 간혹 허용
                if (count === 2 && Math.random() < 0.05) break; 
            }
        }

        currentHand = hand;
        winningTiles = waits;

        // UI 업데이트
        renderHand();
        renderButtons();
        
        document.getElementById('suit-name').innerText = `현재 무늬: [ ${currentSuitObj.name} ]`;
        
        // 쉬움 난이도일 경우 힌트 표시
        const hintElem = document.getElementById('easy-hint');
        if (difficulty === 'easy') {
            hintElem.innerText = `💡 힌트: 총 ${winningTiles.length}개의 오름패가 있습니다.`;
            hintElem.style.display = 'inline-block';
        } else {
            hintElem.style.display = 'none';
        }

        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        selectedTiles.clear();
    }

    function generateRandom13Tiles() {
        let counts = Array(10).fill(0);
        let hand = [];
        while (hand.length < 13) {
            let num = Math.floor(Math.random() * 9) + 1;
            if (counts[num] < 4) {
                counts[num]++;
                hand.push(num);
            }
        }
        return hand.sort((a, b) => a - b);
    }

    function getWinningTiles(hand) {
        let waits = [];
        let counts = Array(10).fill(0);
        hand.forEach(num => counts[num]++);

        for (let tile = 1; tile <= 9; tile++) {
            if (counts[tile] < 4) {
                counts[tile]++;
                if (canFormHand(counts, 14)) {
                    waits.push(tile);
                }
                counts[tile]--;
            }
        }
        return waits;
    }

    function canFormHand(counts, remaining) {
        if (remaining === 0) return true;

        let tempCounts = [...counts];

        if (remaining % 3 === 2) {
            for (let i = 1; i <= 9; i++) {
                if (tempCounts[i] >= 2) {
                    tempCounts[i] -= 2;
                    if (canFormHand(tempCounts, remaining - 2)) return true;
                    tempCounts[i] += 2;
                }
            }
            return false;
        }

        let first = 0;
        for (let i = 1; i <= 9; i++) {
            if (tempCounts[i] > 0) { first = i; break; }
        }

        if (tempCounts[first] >= 3) {
            tempCounts[first] -= 3;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first] += 3;
        }

        if (first <= 7 && tempCounts[first + 1] > 0 && tempCounts[first + 2] > 0) {
            tempCounts[first]--;
            tempCounts[first + 1]--;
            tempCounts[first + 2]--;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first]++;
            tempCounts[first + 1]++;
            tempCounts[first + 2]++;
        }

        return false;
    }

    async function renderHand() {
        const container = document.getElementById('hand-container');
        container.innerHTML = '';
        
        for (const num of currentHand) {
            const img = document.createElement('img');
            img.src = await getTileImageSrc(currentSuitObj.code, num);
            img.className = 'tile-img';
            img.alt = `${currentSuitObj.code}${num}`;
            container.appendChild(img);
        }
    }

    function renderButtons() {
        const grid = document.getElementById('selection-buttons');
        grid.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-number';
            btn.innerText = `${i}`;
            btn.onclick = () => toggleSelect(i, btn);
            grid.appendChild(btn);
        }
    }

    function toggleSelect(num, btn) {
        if (selectedTiles.has(num)) {
            selectedTiles.delete(num);
            btn.classList.remove('selected');
        } else {
            selectedTiles.add(num);
            btn.classList.add('selected');
        }
    }

    function submitAnswer() {
        const userAnswers = Array.from(selectedTiles).sort((a, b) => a - b);
        const isCorrect = userAnswers.length === winningTiles.length && 
                          userAnswers.every((val, idx) => val === winningTiles[idx]);

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (isCorrect) {
            resultDiv.className = 'result-message correct';
            resultDiv.innerText = `🎉 정답입니다! (오름패: ${winningTiles.join(', ')})`;
        } else {
            resultDiv.className = 'result-message incorrect';
            resultDiv.innerText = `❌ 오답입니다. 정답 오름패는 [ ${winningTiles.join(', ')} ] 입니다.`;
        }
    }
</script>

</body>
</html>
