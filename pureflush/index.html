<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마작 청일색 텐파이 퀴즈 (ZIP 연동)</title>
    <!-- ZIP 파일을 브라우저에서 읽기 위한 JSZip 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1e3f20;
            color: #333;
        }
        h1 { 
            text-align: center; 
            color: #ffffff; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }
        .btn-main {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-main:hover { background-color: #219150; }
        .btn-main:disabled { background-color: #95a5a6; cursor: not-allowed; }

        .hand-container-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 15px 0;
            background: #2b542c;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .hand-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            min-height: 70px;
            padding: 0 10px;
        }

        .tile-img {
            width: 44px;
            height: 60px;
            
            /* 1. 마작패 전면 흰색/아이보리 톤 배경 및 테두리 */
            background-color: #fdfbf7;
            border: 1px solid #d1ccc0;
            border-radius: 6px; /* 모서리를 살짝 라운딩 처리 */
            
            /* 2. 마작패 전면의 입체감 패널 베젤 효과 (상단/좌측 하이라이트, 하단/우측 그림자) */
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.9),
                inset -1px -1px 2px rgba(0, 0, 0, 0.15),
                1px 2px 4px rgba(0, 0, 0, 0.3); /* 바닥에 떨어지는 그림자 */
        
            /* 3. 패 안쪽 내부 여백 (패가 가장자리에 바짝 붙지 않도록) */
            padding: 3px 2px 2px 2px;
            box-sizing: border-box;
        
            /* 4. 정렬 및 사용자 선택 방지 */
            object-fit: contain;
            flex-shrink: 0;
            user-select: none;
            
            /* 5. 호버 시 살짝 떠오르는 부드러운 효과 (선택사항) */
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        
        .tile-img:hover {
            transform: translateY(-2px);
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.9),
                inset -1px -1px 2px rgba(0, 0, 0, 0.15),
                2px 5px 8px rgba(0, 0, 0, 0.4);
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 8px;
            margin: 20px 0;
        }
        .btn-number {
            padding: 12px 0;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background-color: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-number.selected {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .result-message {
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
        }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<h1>🀄 청일색 텐파이 대기패 퀴즈</h1>

<div class="card">
    <div id="status-msg" style="text-align:center; font-weight:bold; margin-bottom:10px; color:#e67e22;">
        📦 Regular.zip 패키지를 읽어오는 중입니다...
    </div>
    <button class="btn-main" id="btn-generate" onclick="generateQuiz()" disabled>새 문제 생성하기</button>
    <div id="suit-name" style="text-align: center; margin-top: 15px; font-weight: bold; font-size: 18px; color: #444;"></div>
    
    <div class="hand-container-wrapper">
        <div class="hand-display" id="hand-container"></div>
    </div>
</div>

<div class="card" id="quiz-area" style="display: none;">
    <h3 style="margin-top:0;">오름패(대기패)가 되는 숫자를 모두 선택하세요:</h3>
    <div class="selection-grid" id="selection-buttons"></div>
    <button class="btn-main" style="background-color: #2980b9;" onclick="submitAnswer()">제출 및 정답 확인</button>
    <div id="result" class="result-message" style="display: none;"></div>
</div>

<script>
    let zipInstance = null;
    const tileSvgCache = {}; // ZIP 내 SVG 내용 임시 저장소

    const SUITS = [
        { code: 'Man', name: '만자패(萬)' },
        { code: 'Pin', name: '통자패(筒)' },
        { code: 'Sou', name: '삭자패(索)' }
    ];
    
    let currentSuitObj = null;
    let currentHand = [];
    let winningTiles = [];
    let selectedTiles = new Set();

    // 페이지 로드 시 동일 경로의 Regular.zip 파일 읽기
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('FluffyStuff riichi-mahjong-tiles master Regular.zip');
            if (!response.ok) throw new Error('Regular.zip 파일을 찾을 수 없습니다.');
            
            const arrayBuffer = await response.arrayBuffer();
            zipInstance = await JSZip.loadAsync(arrayBuffer);
            
            document.getElementById('status-msg').style.color = '#27ae60';
            document.getElementById('status-msg').innerText = '✅ 마작패 로딩 완료!';
            document.getElementById('btn-generate').disabled = false;
        } catch (err) {
            document.getElementById('status-msg').style.color = '#e74c3c';
            document.getElementById('status-msg').innerText = '❌ Regular.zip 로딩 실패! index.html과 같은 폴더에 Regular.zip이 있는지 확인해주세요.';
            console.error(err);
        }
    });

    // ZIP 내부 파일 탐색 및 SVG Data URL 변환
    async function getTileImageSrc(suitCode, num) {
        const targetName = `${suitCode}${num}.svg`;
        const cacheKey = `${suitCode}${num}`;
        
        if (tileSvgCache[cacheKey]) return tileSvgCache[cacheKey];

        // ZIP 내부 모든 경로 검색하여 파일 찾기
        let targetFile = null;
        zipInstance.forEach((relativePath, file) => {
            if (relativePath.endsWith(targetName)) {
                targetFile = file;
            }
        });

        if (targetFile) {
            const text = await targetFile.async('string');
            const blob = new Blob([text], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            tileSvgCache[cacheKey] = url;
            return url;
        }
        return '';
    }

    function generateQuiz() {
        currentSuitObj = SUITS[Math.floor(Math.random() * SUITS.length)];
        let hand = [];
        
        while (true) {
            hand = generateRandom13Tiles();
            let waits = getWinningTiles(hand);
            if (waits.length > 0) {
                currentHand = hand;
                winningTiles = waits;
                break;
            }
        }

        renderHand();
        renderButtons();
        
        document.getElementById('suit-name').innerText = `현재 무늬: [ ${currentSuitObj.name} ]`;
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        selectedTiles.clear();
    }

    function generateRandom13Tiles() {
        let counts = Array(10).fill(0);
        let hand = [];
        while (hand.length < 13) {
            let num = Math.floor(Math.random() * 9) + 1;
            if (counts[num] < 4) {
                counts[num]++;
                hand.push(num);
            }
        }
        return hand.sort((a, b) => a - b);
    }

    function getWinningTiles(hand) {
        let waits = [];
        let counts = Array(10).fill(0);
        hand.forEach(num => counts[num]++);

        for (let tile = 1; tile <= 9; tile++) {
            if (counts[tile] < 4) {
                counts[tile]++;
                if (canFormHand(counts, 14)) {
                    waits.push(tile);
                }
                counts[tile]--;
            }
        }
        return waits;
    }

    function canFormHand(counts, remaining) {
        if (remaining === 0) return true;

        let tempCounts = [...counts];

        if (remaining % 3 === 2) {
            for (let i = 1; i <= 9; i++) {
                if (tempCounts[i] >= 2) {
                    tempCounts[i] -= 2;
                    if (canFormHand(tempCounts, remaining - 2)) return true;
                    tempCounts[i] += 2;
                }
            }
            return false;
        }

        let first = 0;
        for (let i = 1; i <= 9; i++) {
            if (tempCounts[i] > 0) { first = i; break; }
        }

        if (tempCounts[first] >= 3) {
            tempCounts[first] -= 3;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first] += 3;
        }

        if (first <= 7 && tempCounts[first + 1] > 0 && tempCounts[first + 2] > 0) {
            tempCounts[first]--;
            tempCounts[first + 1]--;
            tempCounts[first + 2]--;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first]++;
            tempCounts[first + 1]++;
            tempCounts[first + 2]++;
        }

        return false;
    }

    async function renderHand() {
        const container = document.getElementById('hand-container');
        container.innerHTML = '';
        
        for (const num of currentHand) {
            const img = document.createElement('img');
            img.src = await getTileImageSrc(currentSuitObj.code, num);
            img.className = 'tile-img';
            img.alt = `${currentSuitObj.code}${num}`;
            container.appendChild(img);
        }
    }

    function renderButtons() {
        const grid = document.getElementById('selection-buttons');
        grid.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-number';
            btn.innerText = `${i}`;
            btn.onclick = () => toggleSelect(i, btn);
            grid.appendChild(btn);
        }
    }

    function toggleSelect(num, btn) {
        if (selectedTiles.has(num)) {
            selectedTiles.delete(num);
            btn.classList.remove('selected');
        } else {
            selectedTiles.add(num);
            btn.classList.add('selected');
        }
    }

    function submitAnswer() {
        const userAnswers = Array.from(selectedTiles).sort((a, b) => a - b);
        const isCorrect = userAnswers.length === winningTiles.length && 
                          userAnswers.every((val, idx) => val === winningTiles[idx]);

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (isCorrect) {
            resultDiv.className = 'result-message correct';
            resultDiv.innerText = `🎉 정답입니다! (오름패: ${winningTiles.join(', ')})`;
        } else {
            resultDiv.className = 'result-message incorrect';
            resultDiv.innerText = `❌ 오답입니다. 정답 오름패는 [ ${winningTiles.join(', ')} ] 입니다.`;
        }
    }
</script>

</body>
</html>
