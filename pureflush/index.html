<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마작 청일색 텐파이 퀴즈</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { text-align: center; color: #2c3e50; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-main:hover { background-color: #2980b9; }
        .hand-display {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 20px 0;
            flex-wrap: wrap;
            min-height: 50px;
        }
        .tile {
            width: 36px;
            height: 50px;
            background: #fff8e7;
            border: 2px solid #b8860b;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.2);
        }
        .tile-suit { font-size: 12px; color: #d35400; }
        .tile-num { font-size: 18px; color: #2c3e50; }
        
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            margin: 20px 0;
        }
        .btn-number {
            padding: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #bdc3c7;
            background-color: #ecf0f1;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-number.selected {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        .result-message {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
        }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<h1>🀄 청일색 텐파이 퀴즈</h1>

<div class="card">
    <button class="btn-main" onclick="generateQuiz()">새 문제 생성</button>
    <div id="suit-name" style="text-align: center; margin-top: 15px; font-weight: bold; color: #7f8c8d;"></div>
    <div class="hand-display" id="hand-container"></div>
</div>

<div class="card" id="quiz-area" style="display: none;">
    <h3>대기패(오름패)를 모두 고르세요:</h3>
    <div class="selection-grid" id="selection-buttons"></div>
    <button class="btn-main" style="background-color: #2ecc71;" onclick="submitAnswer()">제출하기</button>
    <div id="result" class="result-message" style="display: none;"></div>
</div>

<script>
    const SUITS = ['만', '통', '삭'];
    let currentSuit = '';
    let currentHand = [];
    let winningTiles = [];
    let selectedTiles = new Set();

    // 1. 청일색 텐파이 문제 생성
    function generateQuiz() {
        currentSuit = SUITS[Math.floor(Math.random() * SUITS.length)];
        let hand = [];
        
        // 텐파이 상태 패가 만들어질 때까지 랜덤 조합 생성
        while (true) {
            hand = generateRandom13Tiles();
            let waits = getWinningTiles(hand);
            if (waits.length > 0) {
                currentHand = hand;
                winningTiles = waits;
                break;
            }
        }

        renderHand();
        renderButtons();
        
        document.getElementById('suit-name').innerText = `무늬: [ ${currentSuit}자 ]`;
        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        selectedTiles.clear();
    }

    // 2. 패 13장 랜덤 생성 (동일 패 4장 초과 제한)
    function generateRandom13Tiles() {
        let counts = Array(10).fill(0);
        let hand = [];
        while (hand.length < 13) {
            let num = Math.floor(Math.random() * 9) + 1;
            if (counts[num] < 4) {
                counts[num]++;
                hand.push(num);
            }
        }
        return hand.sort((a, b) => a - b);
    }

    // 3. 오름패(대기패) 계산 알고리즘
    function getWinningTiles(hand) {
        let waits = [];
        let counts = Array(10).fill(0);
        hand.forEach(num => counts[num]++);

        for (let tile = 1; tile <= 9; tile++) {
            if (counts[tile] < 4) { // 5장째는 사용 불가
                counts[tile]++;
                if (canFormHand(counts, 14)) {
                    waits.push(tile);
                }
                counts[tile]--;
            }
        }
        return waits;
    }

    // 4. 완성형(4몸통 1머리) 판정
    function canFormHand(counts, remaining) {
        if (remaining === 0) return true;

        let tempCounts = [...counts];

        // 머리가 없는 경우, 머리를 먼저 설정
        if (remaining % 3 === 2) {
            for (let i = 1; i <= 9; i++) {
                if (tempCounts[i] >= 2) {
                    tempCounts[i] -= 2;
                    if (canFormHand(tempCounts, remaining - 2)) return true;
                    tempCounts[i] += 2;
                }
            }
            return false;
        }

        // 몸통(커즈/슌즈) 완성 체크
        let first = 0;
        for (let i = 1; i <= 9; i++) {
            if (tempCounts[i] > 0) { first = i; break; }
        }

        // 1) 커즈(AAA)
        if (tempCounts[first] >= 3) {
            tempCounts[first] -= 3;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first] += 3;
        }

        // 2) 슌즈(ABC)
        if (first <= 7 && tempCounts[first + 1] > 0 && tempCounts[first + 2] > 0) {
            tempCounts[first]--;
            tempCounts[first + 1]--;
            tempCounts[first + 2]--;
            if (canFormHand(tempCounts, remaining - 3)) return true;
            tempCounts[first]++;
            tempCounts[first + 1]++;
            tempCounts[first + 2]++;
        }

        return false;
    }

    // UI 렌더링
    function renderHand() {
        const container = document.getElementById('hand-container');
        container.innerHTML = '';
        currentHand.forEach(num => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `<span class="tile-num">${num}</span><span class="tile-suit">${currentSuit}</span>`;
            container.appendChild(tile);
        });
    }

    function renderButtons() {
        const grid = document.getElementById('selection-buttons');
        grid.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-number';
            btn.innerText = i;
            btn.onclick = () => toggleSelect(i, btn);
            grid.appendChild(btn);
        }
    }

    function toggleSelect(num, btn) {
        if (selectedTiles.has(num)) {
            selectedTiles.delete(num);
            btn.classList.remove('selected');
        } else {
            selectedTiles.add(num);
            btn.classList.add('selected');
        }
    }

    // 채점하기
    function submitAnswer() {
        const userAnswers = Array.from(selectedTiles).sort((a, b) => a - b);
        const isCorrect = userAnswers.length === winningTiles.length && 
                          userAnswers.every((val, idx) => val === winningTiles[idx]);

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (isCorrect) {
            resultDiv.className = 'result-message correct';
            resultDiv.innerText = `⭕ 정답입니다! (오름패: ${winningTiles.join(', ')})`;
        } else {
            resultDiv.className = 'result-message incorrect';
            resultDiv.innerText = `❌ 오답입니다. 정답 오름패: ${winningTiles.join(', ')}`;
        }
    }
</script>

</body>
</html>
