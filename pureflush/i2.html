<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>
  <script>
    // index.html의 소스 코드를 불러와 현재 문서에 덮어씌움
    fetch('index.html')
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</body>
</html>
