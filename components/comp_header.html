<header class="header-outer">
  <div class="header-container">
    <!-- 1줄: 로고(좌측 끝) / 테마 버튼(우측 끝) -->
    <div class="header-row header-row-1">
      <h1><a href="/" style="color: inherit; text-decoration: none;">VALKEN.NET</a></h1>
      
      <div class="header-actions">
        <!-- 언어 선택 셀렉트 박스 -->
        <select id="langSelect" class="header-dropdown lang-dropdown" onchange="switchLanguage(this.value)">
          <option value="ko">한국어 🇰🇷</option>
          <option value="en">English 🇺🇸</option>
          <option value="ja">日本語 🇯🇵</option>
          <option value="zh_CN">简体中文 🇨🇳</option>
          <option value="zh_TW">繁體中文 🇹🇼</option>
        </select>

        <!-- 테마 전환 버튼 -->
        <button id="themeToggle" class="theme-toggle-btn">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">다크</span>
        </button>
      </div>
    </div>

    <!-- 2줄: 주요 메뉴(좌측) / 더보기 드롭다운(우측) -->
    <nav class="header-row header-row-2">
      <div class="main-nav-links">
        <a href="/">오늘의퀴즈</a>
        <a href="/chinitsu_hub.html">허브</a>
        <a href="/chinitsu_board.html">게시판</a>
      </div>

      <!-- 기타 메뉴 드롭다운 -->
      <div class="dropdown-menu-container">
        <select class="header-dropdown" onchange="if(this.value) location.href=this.value;">
          <option value="" disabled selected>더보기 ▾</option>
          <option value="/chinitsu_hub.html">허브</option>
          <option value="/chinitsu_about.html">개요</option>
          <option value="/chinitsu_strategy.html">전략&대기</option>
          <option value="/chinitsu_yakuman.html">역만 심화</option>
          <option value="/chinitsu_cheatsheet.html">치트시트</option>
          <option value="/chinitsu_episodes.html">에피소드</option>
          <option value="/chinitsu_qna.html">FAQ</option>
          <option value="/chinitsu_quiz_history.html">과거의 작품</option>
          <option value="/pureflush">pureflush 퀴즈 게임</option>
        </select>
      </div>
    </nav>
  </div>
</header>

<style>
  /* 헤더 전체 영역 */
  .header-outer {
    width: 100%;
    background-color: var(--bg-header, transparent);
  }

  /* 헤더 컨테이너: 본문 카드 영역 너비와 동일하게 맞춤 (필요시 max-width 값 조정) */
  .header-container {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1rem;
    box-sizing: border-box;
    width: 100%;
  }

  /* 각 행 공통: 전체 너비를 차지하도록 설정 */
  .header-row {
    display: flex;
    width: 100%;
    box-sizing: border-box;
  }

  /* 1줄: 로고 좌측, 테마버튼 우측 끝 정렬 */
  .header-row-1 {
    justify-content: space-between;
    align-items: center;
  }

  .header-row-1 h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: bold;
  }

  /* 1줄 우측 버튼 그룹 */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* 2줄: 메뉴그룹 좌측, 더보기 드롭다운 우측 정렬 */
  .header-row-2 {
    justify-content: space-between;
    align-items: center;
  }

  .main-nav-links {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .main-nav-links a {
    text-decoration: none;
    color: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
  }

  /* 드롭다운 스타일 (라이트/다크 대응) */
  .header-dropdown {
    background-color: var(--bg-card, #ffffff);
    color: var(--text-color, #1a1a1a);
    border: 1px solid var(--border-color, #cccccc);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
  }

  .header-dropdown option {
    background-color: var(--bg-card, #ffffff);
    color: var(--text-color, #1a1a1a);
  }

  /* 언어 선택 드롭다운 전용 세부 설정 */
  .lang-dropdown {
    font-size: 0.8rem;
    padding: 0.3rem 0.4rem;
  }

  /* 모바일 세부 조정 */
  @media (max-width: 480px) {
    .main-nav-links {
      gap: 0.5rem;
    }
    .main-nav-links a {
      font-size: 0.88rem;
    }
    .header-dropdown {
      padding: 0.25rem 0.4rem;
      font-size: 0.8rem;
    }
    .lang-dropdown {
      font-size: 0.75rem;
      padding: 0.2rem 0.3rem;
    }
  }
</style>

<script>
  // 지원 언어 및 디렉토리 접두사 정의
  const LANG_CONFIG = [
    { code: 'ko', prefix: '' },
    { code: 'en', prefix: '/en' },
    { code: 'ja', prefix: '/ja' },
    { code: 'zh_CN', prefix: '/zh_CN' },
    { code: 'zh_TW', prefix: '/zh_TW' }
  ];

  // 1. 순수 파일 경로(언어 접두사 제외) 추출 함수
  function getCleanPath() {
    const currentPath = window.location.pathname;
    let cleanPath = currentPath;

    for (const lang of LANG_CONFIG) {
      if (lang.prefix && (cleanPath.startsWith(lang.prefix + '/') || cleanPath === lang.prefix)) {
        cleanPath = cleanPath.substring(lang.prefix.length);
        break;
      }
    }

    if (cleanPath === '' || cleanPath === '/') {
      cleanPath = '/index.html';
    }

    return cleanPath;
  }

  // 2. 언어 변경 처리 함수
  function switchLanguage(targetLangCode) {
    const cleanPath = getCleanPath();
    const targetConfig = LANG_CONFIG.find(l => l.code === targetLangCode) || LANG_CONFIG[0];
    
    window.location.href = targetConfig.prefix + cleanPath;
  }

  // 3. 현재 접속 URL 기반 언어 셀렉트 박스 활성화
  (function initLangSelect() {
    const currentPath = window.location.pathname;
    let currentLang = 'ko';

    for (const lang of LANG_CONFIG) {
      if (lang.prefix && (currentPath.startsWith(lang.prefix + '/') || currentPath === lang.prefix)) {
        currentLang = lang.code;
        break;
      }
    }

    const langSelectEl = document.getElementById('langSelect');
    if (langSelectEl) {
      langSelectEl.value = currentLang;
    }
  })();

  // 4. hreflang 동적 태그 생성 (SEO 보완용)
  (function injectHreflang() {
    const domain = 'https://www.valken.net';
    const cleanPath = getCleanPath();

    document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(el => el.remove());

    const head = document.head || document.getElementsByTagName('head')[0];

    LANG_CONFIG.forEach(lang => {
      const link = document.createElement('link');
      link.rel = 'alternate';
      link.hreflang = lang.code;
      link.href = `${domain}${lang.prefix}${cleanPath}`;
      head.appendChild(link);
    });

    const defaultLink = document.createElement('link');
    defaultLink.rel = 'alternate';
    defaultLink.hreflang = 'x-default';
    defaultLink.href = `${domain}${cleanPath}`;
    head.appendChild(defaultLink);
  })();
</script>
