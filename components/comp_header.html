  .header-dropdown {
    background-color: var(--bg-card, #ffffff);
    color: var(--text-color, #1a1a1a);
    border: 1px solid var(--border-color, #cccccc);
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
