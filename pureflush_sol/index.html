<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청일색 오름패 계산기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #4CAF50;
            font-size: 16px;
            line-height: 1.6;
        }
        .error { border-left-color: #f44336; color: #f44336; }
        .note {
            margin-top: 8px;
            font-size: 14px;
            color: #d9534f;
        }
    </style>
</head>
<body>

    <h2>청일색 오름패 계산기</h2>
    <div class="input-group">
        <label for="handInput">13자리 숫자 입력 (예: 2222345778899)</label>
        <input type="text" id="handInput" maxlength="13" placeholder="예: 2222345778899">
    </div>
    <button onclick="calculateWaits()">오름패 찾기</button>

    <div id="resultBox" class="result" style="display:none;"></div>

    <script>
        function calculateWaits() {
            const input = document.getElementById('handInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';

            // 입력 검증
            if (!/^[1-9]{13}$/.test(input)) {
                resultBox.className = "result error";
                resultBox.innerHTML = "1부터 9까지의 숫자 13자리를 정확히 입력해 주세요.";
                return;
            }

            // 패 개수 카운트 (1~9)
            const counts = Array(10).fill(0);
            for (let char of input) {
                counts[parseInt(char)]++;
            }

            // 동일한 패가 5개 이상 입력된 경우 예외 처리
            for (let i = 1; i <= 9; i++) {
                if (counts[i] > 4) {
                    resultBox.className = "result error";
                    resultBox.innerHTML = `오류: ${i} 패가 4개를 초과했습니다.`;
                    return;
                }
            }

            const theoreticalWaits = []; // 이론적 대기패
            const maxedOutTiles = [];    // 이미 4장을 들고 있어 실제로는 완성할 수 없는 패

            // 1부터 9까지의 패를 형태상으로만 1장 추가해보며 오름 형태가 되는지 확인
            for (let tile = 1; tile <= 9; tile++) {
                counts[tile]++;
                if (canWin(counts)) {
                    theoreticalWaits.push(tile);
                    // 만약 가상 추가 전 이미 4장을 갖고 있었다면 예외 목록에 기록
                    if (counts[tile] - 1 === 4) {
                        maxedOutTiles.push(tile);
                    }
                }
                counts[tile]--; // 원복
            }

            // 결과 출력
            resultBox.className = "result";
            if (theoreticalWaits.length > 0) {
                let html = `<strong>오름패:</strong> ${theoreticalWaits.join(', ')}`;
                
                // 4장을 이미 들고 있는 패가 존재할 경우 안내 문구 추가
                if (maxedOutTiles.length > 0) {
                    html += `<div class="note">※ 단, ${maxedOutTiles.join(', ')}번 패는 이미 손패에 4장을 들고 있어 실질적으로 오를 수 없습니다.</div>`;
                }
                
                resultBox.innerHTML = html;
            } else {
                resultBox.innerHTML = "오름패가 없습니다 (노텐).";
            }
        }

        // 14장의 패가 완성형인지 확인
        function canWin(counts) {
            // 1. 칠대자(치토이츠) 검사
            let pairs = 0;
            for (let i = 1; i <= 9; i++) {
                if (counts[i] === 2) pairs++;
            }
            if (pairs === 7) return true;

            // 2. 일반 형태 검사 (머리 1개 + 몸통 4개)
            const tempCounts = [...counts];
            for (let head = 1; head <= 9; head++) {
                if (tempCounts[head] >= 2) {
                    tempCounts[head] -= 2;
                    if (checkMentsu(tempCounts, 0)) {
                        return true;
                    }
                    tempCounts[head] += 2;
                }
            }
            return false;
        }

        // 몸통(커즈 또는 슌즈) 4개 완성 가능 여부 재귀 검사
        function checkMentsu(counts, depth) {
            if (depth === 4) return true;

            let first = 0;
            for (let i = 1; i <= 9; i++) {
                if (counts[i] > 0) {
                    first = i;
                    break;
                }
            }
            if (first === 0) return true;

            // 커즈(같은 패 3장) 제거 시도
            if (counts[first] >= 3) {
                counts[first] -= 3;
                if (checkMentsu(counts, depth + 1)) return true;
                counts[first] += 3;
            }

            // 슌즈(연속된 패 3장) 제거 시도
            if (first <= 7 && counts[first + 1] > 0 && counts[first + 2] > 0) {
                counts[first]--;
                counts[first + 1]--;
                counts[first + 2]--;
                if (checkMentsu(counts, depth + 1)) return true;
                counts[first]++;
                counts[first + 1]++;
                counts[first + 2]++;
            }

            return false;
        }
    </script>
</body>
</html>
