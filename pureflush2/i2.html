<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>
  <script>
    // 최신 index.html 가져오기 (캐시 방지)
    fetch('index.html?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(response => response.text())
      .then(html => {
        // index.html 내부의 script.js 로드 경로 뒤에 ?wrapped=true 주입
        const wrappedHtml = html.replace('script.js', 'script.js?wrapped=true');
        
        document.open();
        document.write(wrappedHtml);
        document.close();
      })
      .catch(err => console.error('index.html 로드 실패:', err));
  </script>
</body>
</html>
