<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>
  <script>
    // i2.html을 거쳐 진입했음을 알리는 전역 플래그 설정
    window.__IS_WRAPPED__ = true;

    // 타임스탬프(?t=시간)를 붙여 브라우저 캐시를 무효화하고 항상 최신 index.html 요청
    fetch('index.html?t=' + new Date().getTime(), { cache: 'no-store' })
      .then(response => response.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(err => {
        console.error('index.html 로드 실패:', err);
      });
  </script>
</body>
</html>
