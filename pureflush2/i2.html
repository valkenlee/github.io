<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>
  <script>
    fetch('index.html')
      .then(response => response.text())
      .then(html => {
        // index.html 소스 상단 <head> 바로 뒤에 플래그 변수 주입
        const wrappedHtml = html.replace('<head>', '<head><script>window.__IS_WRAPPED__ = true;<\/script>');
        
        document.open();
        document.write(wrappedHtml);
        document.close();
      });
  </script>
</body>
</html>
