<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마작 청일색 대기패 연습기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🀄 청일색 대기패 연습기</h1>

    <div id="mode-selector">
        <button class="mode-btn active" onclick="setMode('easy')">쉬움 (대기 1~2개)</button>
        <button class="mode-btn" onclick="setMode('normal')">보통 (대기 2~4개)</button>
        <button class="mode-btn" onclick="setMode('hard')">어려움 (대기 3~9개)</button>
        <button class="mode-btn streak-mode" onclick="setMode('streak')">🔥 어려움 연승 모드</button>
    </div>

    <div id="timer-bar-container"><div id="timer-bar"></div></div>
    
    <div id="streak-info">
        <span>현재 연승: <strong id="current-streak">0</strong></span>
        <span>최고 연승: <strong id="best-streak">0</strong></span>
    </div>

    <!-- 명예의 전당 (Top 10) 영역 -->
    <div id="hall-of-fame" class="hof-container hidden">
        <div class="hof-title">🏆 명예의 전당 (어려움 연승 모드 Top 10)</div>
        <ol id="hof-list" class="hof-list"></ol>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div id="loader-text">이미지 압축 파일을 불러오는 중...</div>
    </div>

    <div id="game-container">
        <!-- 타패 정보 영역 -->
        <div id="discard-info" class="discard-container hidden">
            <span>버린 패:</span>
            <div id="discard-tile" class="discard-tile-box"></div>
        </div>

        <div class="hand-container">
            <p><strong>[ 현재 손패 (13장) ]</strong></p>
            <div id="hand-display" class="tile-list"></div>
            <div id="hint-box" class="hint"></div>
        </div>

        <p><strong>[ 대기패를 모두 선택하세요 ]</strong></p>
        <div id="wait-selector" class="tile-list"></div>

        <div style="margin-top: 20px;">
            <button id="submit-btn" class="btn" onclick="checkAnswer()">정답 확인</button>
            <button id="next-btn" class="btn hidden" onclick="generateProblem()">다음 문제</button>
        </div>

        <div id="result-message" class="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
