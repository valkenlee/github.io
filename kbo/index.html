      display: flex;

      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      background: #f1f3f5;

    .ctrl-btn {

      user-select: none;

      justify-content: center;
    }
    .ctrl-btn:active {
      background: #e9ecef;
      transform: scale(0.96);

    .chart-container {
      position: relative;
      height: 420px;
      width: 100%;
      cursor: grab;
      touch-action: pan-y; /* 수평 모바일 스크롤 및 브라우저 줌 간섭 방지 */
    }
    .chart-container:active {
      cursor: grabbing;
    }
    .legend-custom {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
    }
    .legend-btn {
      border: 1px solid #ddd;
      background: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-btn:hover {
      background: #f1f3f5;
    }
    .legend-btn.active {
      border-color: #333;
      background: #333;
      color: #fff;
    }
    .legend-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .reset-btn {
      display: block;
      margin: 12px auto 0;
      padding: 6px 12px;
      font-size: 12px;
      color: #888;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      .chart-container { height: 350px; }
      .controls-bar { justify-content: center; }
    }
  </style>

</head>
<body>

<div class="container">
  <h1>⚾ 2026년 KBO 팀별 승차 그래프</h1>
  <p class="subtitle">
    주의사항 - 아직 시험중이니 오동작하거나, 그래프 내용에 오류가 있을 수 있습니다.
  </p>  
  <p class="subtitle">
    상단 버튼이나 마우스 휠/드래그로 그래프를 조절하고, 팀 버튼을 눌러 하이라이트해보세요.
  </p>
  
  <!-- 컨트롤 버튼 영역 -->
  <div class="controls-bar">
    <div class="btn-group">
      <button id="zoomInBtn" class="ctrl-btn" title="확대">➕ 확대</button>
      <button id="zoomOutBtn" class="ctrl-btn" title="축소">➖ 축소</button>
    </div>
    <div class="btn-group">
      <button id="panLeftBtn" class="ctrl-btn" title="왼쪽 이동">👈 좌로 이동</button>
      <button id="panRightBtn" class="ctrl-btn" title="오른쪽 이동">👉 우로 이동</button>
    </div>
    <button id="resetZoomBtn" class="ctrl-btn" title="전체보기">🔄 원래대로</button>
  </div>

  <div class="chart-container" id="chartWrapper">
    <canvas id="kboChart"></canvas>
  </div>

  <div id="customLegend" class="legend-custom"></div>
  <button id="resetBtn" class="reset-btn" style="display: none;">전체 선택 해제</button>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRazPhuL7YdPpRSDT0LS9vMDOahNJuQoU59q1pHY9fkMR6NbyB8RZ9IbjFyoubV4NWuLRIp9M93EaF3/pub?gid=1260501516&single=true&output=csv";

  function hexToRgba(hex, alpha) {
    let c = hex.replace('#', '');
    if (c.length === 3) {
      c = c.split('').map(char => char + char).join('');
    }
    const num = parseInt(c, 16);
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
  }

  const teamColors = {
    'LG': '#C3002F',
    'KT': '#000000',
    'SSG': '#CE0E2D',
    'NC': '#315288',
    '두산': '#131230',
    'KIA': '#EA0029',
    '롯데': '#041E42',
    '삼성': '#0066B3',
    '한화': '#FF6600',
    '키움': '#570514'
  };

  let chartInstance = null;
  let selectedTeam = null;
  let totalDataLength = 0;

  // CSV 데이터 처리
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    complete: function(results) {
      processDataAndRenderChart(results.data);
    },
    error: function(err) {
      console.error("CSV 로드 중 오류 발생:", err);
    }
  });

  function processDataAndRenderChart(data) {
    if (!data || data.length === 0) return;

    const keys = Object.keys(data[0]);
    const dateKey = keys[0]; 
    const teamNames = keys.slice(1);

    const labels = data.map(row => row[dateKey]).filter(val => val !== undefined && val !== "");
    totalDataLength = labels.length;

    const datasets = teamNames.map((team, idx) => {
      const color = teamColors[team] || `hsl(${(idx * 36) % 360}, 70%, 50%)`;
      const seriesData = data.map(row => parseFloat(row[team])).filter(val => !isNaN(val));

      return {
        label: team,
        data: seriesData,
        borderColor: color,
        backgroundColor: color,
        borderWidth: 2,
        pointRadius: 1.5,
        pointHoverRadius: 2,
        tension: 0.2,
        originalColor: color
      };
    });

    renderChart(labels, datasets);
    renderCustomLegend(datasets);
    setupChartInteraction();
  }

  function renderChart(labels, datasets) {
    const ctx = document.getElementById('kboChart').getContext('2d');

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false, // 스무스한 드래그를 위해 애니메이션 끎
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false } // 툴팁 비활성화
        },
        scales: {
          x: {
            title: { display: true, text: '날짜 / 경기' },
            grid: { color: '#f0f0f0' },
            min: 0,
            max: labels.length - 1
          },
          y: {
            title: { display: true, text: '승차' },
            grid: { color: '#f0f0f0' }
          }
        },
        onClick: (e, elements) => {
          if (elements.length > 0) {
            const datasetIndex = elements[0].datasetIndex;
            const teamName = chartInstance.data.datasets[datasetIndex].label;
            toggleHighlight(teamName);
          }
        }
      }
    });
  }

  // 커스텀 줌 / 팬(Pan) & 마우스 드래그 로직
  function setupChartInteraction() {
    const wrapper = document.getElementById('chartWrapper');
    let isDragging = false;
    let startX = 0;
    let startMin = 0;
    let startMax = 0;

    // 1. 버튼 조작 이벤트
    document.getElementById('zoomInBtn').addEventListener('click', () => zoom(0.7));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoom(1.3));
    document.getElementById('panLeftBtn').addEventListener('click', () => pan(-0.2));
    document.getElementById('panRightBtn').addEventListener('click', () => pan(0.2));
    document.getElementById('resetZoomBtn').addEventListener('click', resetZoom);

    // 2. PC 마우스 휠 줌
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) zoom(0.8);
      else zoom(1.2);

    }, { passive: false });

    // 3. PC 마우스 좌클릭 드래그로 좌우 이동 (Pan)
    wrapper.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startMin = chartInstance.options.scales.x.min;
      startMax = chartInstance.options.scales.x.max;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const chartWidth = wrapper.clientWidth;
      const range = startMax - startMin;
      
      // 마우스 이동 비례 X축 인덱스 변환
      const shift = (dx / chartWidth) * range;
      let newMin = startMin - shift;
      let newMax = startMax - shift;

      // 경계 제한
      if (newMin < 0) {
        newMin = 0;
        newMax = range;
      }
      if (newMax > totalDataLength - 1) {
        newMax = totalDataLength - 1;
        newMin = newMax - range;
      }

      chartInstance.options.scales.x.min = newMin;
      chartInstance.options.scales.x.max = newMax;
      chartInstance.update('none');
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
  }

// 확대/축소 함수 (오른쪽 끝 고정 방식)
  function zoom(factor) {
    const xScale = chartInstance.options.scales.x;
    const currentMin = xScale.min;
    const currentMax = xScale.max;
    const range = currentMax - currentMin;

    let newRange = range * factor;

    // 최소/최대 범위 제어 (최소 4개 데이터 포인트 ~ 전체)
    if (newRange < 4) newRange = 4;
    if (newRange > totalDataLength - 1) newRange = totalDataLength - 1;

    // 오른쪽 끝(currentMax)을 고정한 채 왼쪽(newMin)만 조절
    let newMax = currentMax;
    let newMin = newMax - newRange;

    // 범위가 0보다 작아질 경우 처리
    if (newMin < 0) {
      newMin = 0;
      newMax = newRange;
    }

    // 오른쪽 끝이 전체 데이터 길이를 초과하는 경우
    if (newMax > totalDataLength - 1) {
      newMax = totalDataLength - 1;
      newMin = newMax - newRange;
    }

    xScale.min = newMin;
    xScale.max = newMax;
    chartInstance.update('none');
  }

  // 이동(Pan) 함수
  function pan(percent) {
    const xScale = chartInstance.options.scales.x;
    const range = xScale.max - xScale.min;
    const shift = range * percent;

    let newMin = xScale.min + shift;
    let newMax = xScale.max + shift;

    if (newMin < 0) {
      newMin = 0;
      newMax = range;
    }
    if (newMax > totalDataLength - 1) {
      newMax = totalDataLength - 1;
      newMin = newMax - range;
    }

    xScale.min = newMin;
    xScale.max = newMax;
    chartInstance.update('none');
  }

  // 줌 초기화
  function resetZoom() {
    chartInstance.options.scales.x.min = 0;
    chartInstance.options.scales.x.max = totalDataLength - 1;
    chartInstance.update('none');
  }

  // 팀 하이라이트 관련 기능
  function toggleHighlight(teamName) {
    if (selectedTeam === teamName) {
      selectedTeam = null;
    } else {
      selectedTeam = teamName;
    }

    updateChartStyles();
    updateLegendStyles();
  }

  function updateChartStyles() {
    chartInstance.data.datasets.forEach(ds => {
      if (!selectedTeam) {
        ds.borderColor = ds.originalColor;
        ds.backgroundColor = ds.originalColor;
        ds.borderWidth = 2;
        ds.pointRadius = 1.5; 
      } else if (ds.label === selectedTeam) {
        ds.borderColor = ds.originalColor;
        ds.backgroundColor = ds.originalColor;
        ds.borderWidth = 4;
        ds.pointRadius = 4;
      } else {
        const dimColor = hexToRgba(ds.originalColor, 0.25);
        ds.borderColor = dimColor;
        ds.backgroundColor = dimColor;
        ds.borderWidth = 1.5;
        ds.pointRadius = 0;
      }
    });

    chartInstance.update('none');
    document.getElementById('resetBtn').style.display = selectedTeam ? 'block' : 'none';
  }

  function renderCustomLegend(datasets) {
    const legendContainer = document.getElementById('customLegend');
    legendContainer.innerHTML = '';

    datasets.forEach(ds => {
      const btn = document.createElement('button');
      btn.className = 'legend-btn';
      btn.dataset.team = ds.label;

      const dot = document.createElement('span');
      dot.className = 'legend-color-dot';
      dot.style.backgroundColor = ds.originalColor;

      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(ds.label));

      btn.addEventListener('click', () => {
        toggleHighlight(ds.label);
      });

      legendContainer.appendChild(btn);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      selectedTeam = null;
      updateChartStyles();
      updateLegendStyles();
    });
  }

  function updateLegendStyles() {
    const buttons = document.querySelectorAll('.legend-btn');
    buttons.forEach(btn => {
      if (selectedTeam && btn.dataset.team === selectedTeam) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }
</script>
