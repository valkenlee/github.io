<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Clock</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #131518, #202428, #2b3036);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Oswald', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .title {
      font-size: 1.8rem;
      letter-spacing: 4px;
      margin-bottom: 40px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
    }

    .clock-container {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 40px 50px;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .unit-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .unit-label {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    .digits-container {
      display: flex;
      gap: 8px;
    }

    .colon-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      height: 120px;
      padding-bottom: 25px;
    }

    .colon-dot {
      width: 10px;
      height: 10px;
      background-color: #ff5e62;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff5e62;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 플립 카드 공통 */
    .flip-card {
      position: relative;
      width: 80px;
      height: 120px;
      font-size: 5rem;
      line-height: 120px;
      font-weight: 600;
      perspective: 500px; /* 3D 원근감 */
      border-radius: 12px;
      background-color: #15181a;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .card-face {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      color: #f1f5f9;
      text-align: center;
      user-select: none;
    }

    .card-face span {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
    }

    /* 배경 카드 (고정된 뒷면) */
    .top-face {
      top: 0;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      background: linear-gradient(to bottom, #2a3138, #1e2429);
      border-bottom: 1px solid rgba(0, 0, 0, 0.8);
    }
    .top-face span { top: 0; }

    .bottom-face {
      bottom: 0;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      background: linear-gradient(to bottom, #191e22, #111417);
    }
    .bottom-face span { bottom: 0; }

    /* 움직이는 카드 (플립 효과) */
    .leaf-top, .leaf-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden; /* 뒷면을 숨겨서 깜빡임 방지 */
      transform-style: preserve-3d;
    }

    /* 위쪽 움직이는 카드 */
    .leaf-top {
      top: 0;
      background: linear-gradient(to bottom, #2a3138, #1e2429);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.8);
      transform-origin: bottom; /* 아래쪽을 축으로 회전 */
      z-index: 3;
    }
    .leaf-top span {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
    }

    /* 아래쪽 움직이는 카드 */
    .leaf-bottom {
      top: 50%;
      background: linear-gradient(to bottom, #191e22, #111417);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      transform-origin: top; /* 위쪽을 축으로 회전 */
      transform: rotateX(90deg); /* 초기 상태는 90도로 꺾여서 안 보이게 설정 */
      z-index: 2;
    }
    .leaf-bottom span {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
    }

    /* 🔥 핵심 애니메이션: 순차적으로 실행되며, 음영 효과(brightness) 추가 🔥 */
    .flip-card.flipping .leaf-top {
      /* 중력에 의해 점점 빨리 떨어지는 느낌 (ease-in) */
      animation: flip-top-anim 0.3s ease-in forwards;
    }

    .flip-card.flipping .leaf-bottom {
      /* 위 카드가 끝난 후(0.3s 딜레이) 이어서 떨어짐 (ease-out) */
      animation: flip-bottom-anim 0.3s ease-out 0.3s forwards;
    }

    @keyframes flip-top-anim {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.3); } /* 떨어지면서 어두워짐 */
    }

    @keyframes flip-bottom-anim {
      0% { transform: rotateX(90deg); filter: brightness(0.3); } /* 어두운 상태에서 시작 */
      100% { transform: rotateX(0deg); filter: brightness(1); } /* 펴지면서 밝아짐 */
    }

    /* 카드 중간 절취선 그림자 */
    .flip-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -2%;
      width: 104%;
      height: 2px;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10;
      box-shadow: 0 1px 1px rgba(255, 255, 255, 0.15);
      margin-top: -1px;
    }

    @media (max-width: 650px) {
      .clock-container { padding: 25px 20px; gap: 10px; }
      .flip-card { width: 50px; height: 75px; font-size: 3.2rem; line-height: 75px; border-radius: 8px; }
      .top-face, .leaf-top { border-top-left-radius: 8px; border-top-right-radius: 8px; }
      .bottom-face, .leaf-bottom { border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
      .colon-group { height: 75px; gap: 10px; padding-bottom: 15px; }
      .title { font-size: 1.3rem; margin-bottom: 25px; }
    }
  </style>
</head>
<body>

  <h1 class="title">3D Flip Clock</h1>

  <div class="clock-container">
    <div class="unit-group">
      <div class="digits-container">
        <div class="flip-card" id="h1">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
        <div class="flip-card" id="h2">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
      </div>
      <span class="unit-label">HOURS</span>
    </div>

    <div class="colon-group">
      <div class="colon-dot"></div>
      <div class="colon-dot"></div>
    </div>

    <div class="unit-group">
      <div class="digits-container">
        <div class="flip-card" id="m1">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
        <div class="flip-card" id="m2">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
      </div>
      <span class="unit-label">MINUTES</span>
    </div>

    <div class="colon-group">
      <div class="colon-dot"></div>
      <div class="colon-dot"></div>
    </div>

    <div class="unit-group">
      <div class="digits-container">
        <div class="flip-card" id="s1">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
        <div class="flip-card" id="s2">
          <div class="card-face top-face"><span>0</span></div>
          <div class="card-face bottom-face"><span>0</span></div>
          <div class="leaf-top"><span>0</span></div>
          <div class="leaf-bottom"><span>0</span></div>
        </div>
      </div>
      <span class="unit-label">SECONDS</span>
    </div>
  </div>

  <script>
    class FlipDigit {
      constructor(element) {
        this.element = element;
        this.topFace = element.querySelector('.top-face span');
        this.bottomFace = element.querySelector('.bottom-face span');
        this.leafTop = element.querySelector('.leaf-top span');
        this.leafBottom = element.querySelector('.leaf-bottom span');
        this.currentValue = null;
        this.isFlipping = false;
      }

      setValue(newValue, animate = true) {
        newValue = String(newValue);

        if (this.currentValue === newValue) return;

        if (this.currentValue === null || !animate) {
          this.topFace.textContent = newValue;
          this.bottomFace.textContent = newValue;
          this.leafTop.textContent = newValue;
          this.leafBottom.textContent = newValue;
          this.currentValue = newValue;
          return;
        }

        if (this.isFlipping) return;
        this.isFlipping = true;

        // 1. 뒤쪽 상단에 새 숫자
        this.topFace.textContent = newValue;
        // 2. 떨어지는 윗 카드에는 현재 숫자
        this.leafTop.textContent = this.currentValue;
        // 3. 이어서 떨어질 아랫 카드에는 새 숫자
        this.leafBottom.textContent = newValue;
        // 4. 뒤쪽 하단에는 아직 현재 숫자 유지
        this.bottomFace.textContent = this.currentValue;

        this.element.classList.add('flipping');

        // 0.6초 (0.3초 위 + 0.3초 아래) 후 초기화
        setTimeout(() => {
          this.element.classList.remove('flipping');
          this.bottomFace.textContent = newValue;
          this.leafTop.textContent = newValue;
          this.currentValue = newValue;
          this.isFlipping = false;
        }, 600);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const digits = {
        h1: new FlipDigit(document.getElementById('h1')),
        h2: new FlipDigit(document.getElementById('h2')),
        m1: new FlipDigit(document.getElementById('m1')),
        m2: new FlipDigit(document.getElementById('m2')),
        s1: new FlipDigit(document.getElementById('s1')),
        s2: new FlipDigit(document.getElementById('s2'))
      };

      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        digits.h1.setValue(hours[0]);
        digits.h2.setValue(hours[1]);
        digits.m1.setValue(minutes[0]);
        digits.m2.setValue(minutes[1]);
        digits.s1.setValue(seconds[0]);
        digits.s2.setValue(seconds[1]);
      }

      updateClock();
      setInterval(updateClock, 1000);
    });
  </script>
</body>
</html>
