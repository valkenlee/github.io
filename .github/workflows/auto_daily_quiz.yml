name: Auto Daily Quiz Pipeline

on:
  schedule:
    # 매일 한국 시간 07:00 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '실행할 날짜 (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Daily Quiz Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            node js/auto_daily_quiz.cjs ${{ inputs.target_date }}
          else
            node js/auto_daily_quiz.cjs
          fi

      # 기존 복잡한 git shell 커맨드 대신 공식 자동 커밋 액션 사용
      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: Generate daily quiz data [skip ci]"
          file_pattern: "js/data/*.json"
