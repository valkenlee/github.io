name: Auto Daily Quiz Pipeline

on:
  schedule:
    # 매일 한국 시간 07:00 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '실행할 날짜 (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Daily Quiz Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            node js/auto_daily_quiz.cjs ${{ inputs.target_date }}
          else
            node js/auto_daily_quiz.cjs
          fi

      - name: Commit and Push generated JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. 파일 스테이징 전, 원격 저장소의 최신 이력을 강제로 당겨와 융합
          git fetch origin main
          git reset --soft origin/main
          
          # 2. 변경된 파일만 스테이징
          git add js/data/
          
          # 3. 커밋 및 푸시
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: Generate daily quiz data [skip ci]"
            git push origin main
          fi
