name: Auto Daily Quiz Pipeline

on:
  schedule:
    # 매일 한국 시간 05:00 (UTC 20:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '실행할 날짜 (YYYY-MM-DD)'
        required: false
        default: ''

# GITHUB_TOKEN에 쓰기 권한 부여
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Rebase 및 Push 충돌 방지를 위해 전체 Git 히스토리 가져오기

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Daily Quiz Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            node js/auto_daily_quiz.cjs ${{ inputs.target_date }}
          else
            node js/auto_daily_quiz.cjs
          fi

        - name: Commit and Push generated JSON data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add js/data/
          
          # 변경 사항이 있는 경우에만 처리
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: Generate daily quiz data [skip ci]"
            
            # 원격 변경사항 반영 및 Push (최대 5회 재시도)
            for i in {1..5}; do
              echo "Push attempt $i..."
              git fetch origin main
              git rebase origin/main && git push origin main && break
              echo "Rebase/Push conflict detected. Retrying in 3 seconds..."
              sleep 3
            done
          fi
