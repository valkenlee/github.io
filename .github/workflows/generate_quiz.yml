name: Daily Quiz Generator

on:
  schedule:
    # 매일 한국 시간 05:00 (UTC 20:00) 실행
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Daily Quiz
        run: node generate_quiz.js

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git status
          git diff-index --quiet HEAD || git commit -m "auto: Generate daily quiz JSON [skip ci]"
          git push

