name: Generate Quiz Literary Hint

on:
  workflow_dispatch:
    inputs:
      waiting_tiles:
        description: '대기패 정보'
        required: true
        default: '3, 6, 9만 3면대기'
      explanation:
        description: '퀴즈 해설'
        required: true
        default: '12345678만 형태로, 3, 6, 9만을 가져오면 연속된 멘츠가 완성되는 넓은 대기 형태입니다.'

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Story Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_literary_hint.py \
            --tiles "${{ github.event.inputs.waiting_tiles }}" \
            --explanation "${{ github.event.inputs.explanation }}" \
            --output "quiz_hint.json"

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: literary-quiz-hint
          path: quiz_hint.json

