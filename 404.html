<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>페이지 이동 중...</title>
</head>
<body>
    <script>
        // 접속한 경로 추출 (예: "/123" -> "123")
        const path = window.location.pathname.replace(/^\//, '');
        
        // 경로가 순수 숫자로만 구성되어 있는지 확인
        const isNumeric = /^\d+$/.test(path);

        if (isNumeric) {
            console.log("숫자 ID 확인됨, 리다이렉트 진행:", path);
            window.location.href = "https://blog.valken.net/" + path;
        } else {
            console.log("숫자가 아닌 경로 요청:", path);
            document.body.innerHTML = "<h1>404 - 페이지를 찾을 수 없습니다.</h1>";
        }
    </script>
</body>
</html>
